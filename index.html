<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>★ Kuju ★ Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo&family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>

<h1><a href="https://kuju.carrd.co/">★ Kuju ★</a></h1>
<p class="sub">Art Commission: <span id="status" class="badge"></span></p>
<nav>
  <a href="https://kuju.carrd.co/#prices">Prices</a>
  <a href="https://kujupictures.carrd.co">Gallery</a>
  <a href="https://kuju.carrd.co/#tos">Terms of Service</a>
  <a href="index.html">Commission Queue</a>
  <a href="contact.html">Contact Me</a>
</nav>

<h2 id="queue">★ Queue ★</h2>
<div class="card">
  <p style="margin-top:0">Currently accepting: <b id="count"></b></p>
  <div class="row head"><span>Client</span><span>Type</span><span>Progress</span></div>
  <div id="list"></div>
  <div id="tools">
    <button type="button" id="addBtn">+ Add client</button>
    <button type="button" id="statusBtn">Toggle open/closed</button>
    <button type="button" id="saveBtn">Save</button>
  </div>
  <div id="saveMsg" class="stage" style="text-align:center"></div>
</div>

<a href="#" id="editLink">✎ edit queue</a>

<script>
if (location.hash === "#contact") location.replace("contact.html"); // old links
// ---- Queue ----
let data = { status:"OPEN", slots:5, queue:[] }, sha = null, editing = false;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stage = p => p >= 100 ? "Done" : p >= 75 ? "Render" : p >= 50 ? "Color" : p >= 25 ? "Lineart" : p > 0 ? "Sketch" : "Waiting";

function render() {
  document.body.classList.toggle("editing", editing);
  $("status").textContent = data.status;
  $("status").classList.toggle("closed", data.status !== "OPEN");
  const open = Math.max(0, data.slots - data.queue.filter(q => q.progress < 100).length);
  $("count").textContent = `${open}/${data.slots}`;
  let html = data.queue.map((q, i) => editing
    ? `<div class="row"><span contenteditable data-i="${i}" data-k="name">${esc(q.name)}</span><span contenteditable data-i="${i}" data-k="type">${esc(q.type)}</span>
       <div class="prog"><input type="range" min="0" max="100" step="5" value="${q.progress}" data-i="${i}"><div class="stage">${stage(q.progress)} · ${q.progress}%</div></div>
       <button type="button" class="x" data-del="${i}">✕</button></div>`
    : `<div class="row"><span>⭐ ${esc(q.name)}</span><span>${esc(q.type)}</span><div class="prog"><div class="bar"><i style="width:${q.progress}%"></i></div><div class="stage">${stage(q.progress)}</div></div></div>`
  ).join("");
  for (let i = data.queue.length; i < data.slots; i++)
    html += `<div class="row empty"><span>⭐ Open slot</span><span>—</span><span></span></div>`;
  $("list").innerHTML = html;
}

$("list").addEventListener("input", e => {
  const t = e.target, q = data.queue[t.dataset.i];
  if (!q) return;
  if (t.type === "range") { q.progress = +t.value; t.nextElementSibling.textContent = `${stage(q.progress)} · ${q.progress}%`; }
  else q[t.dataset.k] = t.textContent.trim();
});
$("list").addEventListener("click", e => {
  if (e.target.dataset.del) { data.queue.splice(e.target.dataset.del, 1); render(); }
});
$("addBtn").onclick = () => { data.queue.push({ name:"New client", type:"Illustration", progress:0 }); render(); };
$("statusBtn").onclick = () => { data.status = data.status === "OPEN" ? "CLOSED" : "OPEN"; render(); };

$("editLink").onclick = e => {
  e.preventDefault();
  let token = localStorage.getItem("ghToken");
  if (!token) {
    token = prompt("Paste your GitHub token (only saved in this browser):");
    if (!token) return;
    localStorage.setItem("ghToken", token.trim());
  }
  editing = true; render(); $("queue").scrollIntoView();
};

const api = `https://api.github.com/repos/${CONFIG.repo}/contents/queue.json`;
$("saveBtn").onclick = async () => {
  const headers = { Authorization: "Bearer " + localStorage.getItem("ghToken"), Accept: "application/vnd.github+json" };
  $("saveMsg").textContent = "Saving…";
  try {
    if (!sha) sha = (await (await fetch(api, { headers })).json()).sha;
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2) + "\n")));
    const r = await fetch(api, { method:"PUT", headers, body: JSON.stringify({ message:"Update queue", content, sha }) });
    if (r.status === 401) { localStorage.removeItem("ghToken"); throw "Token rejected. Click edit again to re-enter it."; }
    if (!r.ok) throw "Save failed (" + r.status + ").";
    sha = (await r.json()).content.sha;
    editing = false; render();
    $("saveMsg").textContent = "Saved! The public page updates in about a minute.";
  } catch (err) { $("saveMsg").textContent = typeof err === "string" ? err : "Save failed."; }
};

fetch("queue.json?" + Date.now()).then(r => r.json()).then(d => { data = d; render(); });
</script>
</body>
</html>
