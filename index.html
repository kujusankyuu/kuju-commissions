<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>★ Kuju ★ Commissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo&family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">

<script>
const CONFIG = {
  // Discord webhook URL (or your Cloudflare Worker URL)
  webhook: "PASTE_YOUR_WEBHOOK_URL_HERE",
  repo: "kujusankyuu/kuju-commissions",
};
</script>

<style>
  :root { --pink:#ff007f; --pink-l:#ffd0e6; --ink:#111; }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:Alexandria, sans-serif; color:var(--ink);
    background:var(--pink) radial-gradient(#ffffff70 1.5px, transparent 1.6px) 0 0/22px 22px;
    padding:40px 16px 60px;
  }
  h1, h2 { color:#fff; text-align:center; font-family:Bungee, sans-serif; font-weight:400; -webkit-text-stroke:0.05em #000; }
  h1 { font-size:52px; margin:0 0 6px; }
  h2 { font-size:2rem; margin:48px 0 16px; }
  .sub { text-align:center; color:#fff; font-family:Baloo, cursive; font-size:28px; -webkit-text-stroke:0.05em #000; margin:0 0 24px; }
  .sub .badge { font-family:Alexandria, sans-serif; font-size:1rem; -webkit-text-stroke:0; vertical-align:middle; }
  .card { max-width:760px; margin:0 auto; background:#fff; border:3px solid #000; border-radius:22px; padding:28px; }
  nav { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  nav a { background:#2a2a2a; color:#fff; border:2px solid #fff; border-radius:99px; padding:8px 22px; text-decoration:none; font-weight:600; font-size:.85rem; }
  .badge { display:inline-block; padding:4px 14px; border-radius:99px; font-weight:800; background:#21c37a; color:#fff; }
  .badge.closed { background:#555; }
  .row { display:grid; grid-template-columns:1fr 1fr 2fr; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid #f3c; }
  .row:last-child { border-bottom:0; }
  .row.head { font-weight:800; background:var(--pink-l); margin:0 -28px; padding:12px 28px; border-bottom:1px solid var(--pink); }
  .bar { height:12px; background:#eee; border-radius:99px; overflow:hidden; border:1px solid #ccc; }
  .bar i { display:block; height:100%; background:var(--pink); border-radius:99px; }
  .stage { font-size:.75rem; margin-top:4px; color:#555; }
  .empty { color:#aaa; }
  label { display:block; font-weight:600; margin:16px 0 6px; font-size:.9rem; }
  input, select, textarea { width:100%; padding:10px 12px; font:inherit; border:2px solid #ddd; border-radius:10px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--pink); }
  textarea { min-height:130px; resize:vertical; }
  .hp { position:absolute; left:-9999px; }
  button { margin-top:22px; width:100%; padding:14px; font:inherit; font-weight:800; color:#fff; background:var(--pink); border:3px solid #000; border-radius:99px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { text-align:center; font-weight:600; margin-top:14px; }
  .row [contenteditable] { outline:none; border-bottom:2px dashed var(--pink); padding:2px; }
  .row input[type=range] { width:100%; accent-color:var(--pink); padding:0; border:0; }
  .x { width:auto; margin:0 0 0 6px; padding:0 8px; font-size:.8rem; border-width:2px; background:#333; }
  #tools { display:none; gap:8px; flex-wrap:wrap; margin-top:16px; }
  #tools button { margin:0; width:auto; flex:1; padding:10px 16px; }
  .editing #tools { display:flex; }
  .editing .row { grid-template-columns:1fr 1fr 2fr auto; }
  .chk { display:flex; gap:8px; align-items:center; font-weight:400; }
  .chk input { width:auto; }
  #editLink { display:block; text-align:center; margin-top:40px; color:#fff8; font-size:.75rem; }
  @media (max-width:560px){ .row{grid-template-columns:1fr 1fr;} .row .prog{grid-column:1/-1;} }
</style>
</head>
<body>

<h1>★ Kuju ★</h1>
<p class="sub">Art Commission: <span id="status" class="badge"></span></p>
<nav>
  <a href="https://kuju.carrd.co/#prices">PRICES</a>
  <a href="https://kuju.carrd.co/#tos">TERMS OF SERVICE</a>
  <a href="#queue">QUEUE</a>
  <a href="#contact">CONTACT</a>
</nav>

<h2 id="queue">★ Queue ★</h2>
<div class="card">
  <p style="margin-top:0">Currently accepting: <b id="count"></b></p>
  <div class="row head"><span>Client</span><span>Type</span><span>Progress</span></div>
  <div id="list"></div>
  <div id="tools">
    <button type="button" id="addBtn">+ Add client</button>
    <button type="button" id="statusBtn">Toggle open/closed</button>
    <button type="button" id="saveBtn">Save</button>
  </div>
  <div id="saveMsg" class="stage" style="text-align:center"></div>
</div>

<h2 id="contact">★ Contact ★</h2>
<div class="card">
  <p style="margin-top:0">Fill out the form below, or reach me on Discord / Twitter <b>@kuju_sankyuu</b>. I'll reply within one week.</p>
  <form id="form">
    <input class="hp" name="website" tabindex="-1" autocomplete="off">
    <label>Name / Brand *</label><input name="name" required>
    <label class="chk"><input type="checkbox" name="anon"> Show me as "Anonymous" in the public queue</label>
    <label>Discord or Twitter username *</label><input name="handle" required placeholder="@">
    <label>Commission Type *</label>
    <select name="type" required>
      <option value="">Choose one…</option>
      <optgroup label="Full Render"><option>Full Render – Headshot</option><option>Full Render – Half Body</option><option>Full Render – Full Body</option></optgroup>
      <optgroup label="Chibi"><option>Chibi – Half Body</option><option>Chibi – Full Body</option></optgroup>
      <optgroup label="Other"><option>Animation</option><option>Other / Not sure</option></optgroup>
    </select>
    <label>PayPal Email (invoice goes here) *</label><input name="paypal" type="email" required>
    <label>Character Type (game / OC / VTuber)</label><input name="ctype">
    <label>Character Name</label><input name="cname">
    <label>Commission details / references *</label>
    <textarea name="details" required placeholder="Pose, expressions, atmosphere, background/props, commercial use, rush, reference links…"></textarea>
    <button>Send Request</button>
    <div id="msg"></div>
  </form>
</div>
<a href="#" id="editLink">✎ edit queue</a>

<script>
// ---- Queue ----
let data = { status:"OPEN", slots:5, queue:[] }, sha = null, editing = false;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stage = p => p >= 100 ? "Done" : p >= 75 ? "Render" : p >= 50 ? "Color" : p >= 25 ? "Lineart" : p > 0 ? "Sketch" : "Waiting";

function render() {
  document.body.classList.toggle("editing", editing);
  $("status").textContent = data.status;
  $("status").classList.toggle("closed", data.status !== "OPEN");
  $("count").textContent = `${data.queue.filter(q => q.progress < 100).length}/${data.slots}`;
  let html = data.queue.map((q, i) => editing
    ? `<div class="row"><span contenteditable data-i="${i}" data-k="name">${esc(q.name)}</span><span contenteditable data-i="${i}" data-k="type">${esc(q.type)}</span>
       <div class="prog"><input type="range" min="0" max="100" step="5" value="${q.progress}" data-i="${i}"><div class="stage">${stage(q.progress)} · ${q.progress}%</div></div>
       <button type="button" class="x" data-del="${i}">✕</button></div>`
    : `<div class="row"><span>⭐ ${esc(q.name)}</span><span>${esc(q.type)}</span><div class="prog"><div class="bar"><i style="width:${q.progress}%"></i></div><div class="stage">${stage(q.progress)}</div></div></div>`
  ).join("");
  for (let i = data.queue.length; i < data.slots; i++)
    html += `<div class="row empty"><span>⭐ Open slot</span><span>—</span><span></span></div>`;
  $("list").innerHTML = html;
}

$("list").addEventListener("input", e => {
  const t = e.target, q = data.queue[t.dataset.i];
  if (!q) return;
  if (t.type === "range") { q.progress = +t.value; t.nextElementSibling.textContent = `${stage(q.progress)} · ${q.progress}%`; }
  else q[t.dataset.k] = t.textContent.trim();
});
$("list").addEventListener("click", e => {
  if (e.target.dataset.del) { data.queue.splice(e.target.dataset.del, 1); render(); }
});
$("addBtn").onclick = () => { data.queue.push({ name:"New client", type:"Illustration", progress:0 }); render(); };
$("statusBtn").onclick = () => { data.status = data.status === "OPEN" ? "CLOSED" : "OPEN"; render(); };

$("editLink").onclick = e => {
  e.preventDefault();
  let token = localStorage.getItem("ghToken");
  if (!token) {
    token = prompt("Paste your GitHub token (only saved in this browser):");
    if (!token) return;
    localStorage.setItem("ghToken", token.trim());
  }
  editing = true; render(); $("queue").scrollIntoView();
};

const api = `https://api.github.com/repos/${CONFIG.repo}/contents/queue.json`;
$("saveBtn").onclick = async () => {
  const headers = { Authorization: "Bearer " + localStorage.getItem("ghToken"), Accept: "application/vnd.github+json" };
  $("saveMsg").textContent = "Saving…";
  try {
    if (!sha) sha = (await (await fetch(api, { headers })).json()).sha;
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2) + "\n")));
    const r = await fetch(api, { method:"PUT", headers, body: JSON.stringify({ message:"Update queue", content, sha }) });
    if (r.status === 401) { localStorage.removeItem("ghToken"); throw "Token rejected. Click edit again to re-enter it."; }
    if (!r.ok) throw "Save failed (" + r.status + ").";
    sha = (await r.json()).content.sha;
    editing = false; render();
    $("saveMsg").textContent = "Saved! The public page updates in about a minute.";
  } catch (err) { $("saveMsg").textContent = typeof err === "string" ? err : "Save failed."; }
};

fetch("queue.json?" + Date.now()).then(r => r.json()).then(d => { data = d; render(); });

// ---- Form -> Discord ----
const form = document.getElementById("form"), msg = document.getElementById("msg");
form.addEventListener("submit", async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(form));
  if (d.website) return; // bot trap
  const btn = form.querySelector("button");
  btn.disabled = true; msg.textContent = "Sending…";
  const field = (name, value) => ({ name, value: (value || "—").slice(0, 1024), inline: true });
  try {
    const r = await fetch(CONFIG.webhook, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: "Commission Form",
        allowed_mentions: { parse: [] },
        embeds: [{
          title: `New request: ${d.type}`.slice(0, 256),
          color: 0xff007f,
          fields: [field("Name", d.name), field("Queue name", d.anon ? "Anonymous" : d.name), field("Contact", d.handle), field("PayPal", d.paypal),
                   field("Character type", d.ctype), field("Character", d.cname)],
          description: d.details.slice(0, 4000),
          timestamp: new Date().toISOString(),
        }],
      }),
    });
    if (!r.ok) throw 0;
    form.reset(); msg.textContent = "Sent! I'll get back to you within a week ★";
  } catch {
    msg.textContent = "Couldn't send. Please DM me on Discord or Twitter instead.";
  }
  btn.disabled = false;
});
</script>
</body>
</html>
